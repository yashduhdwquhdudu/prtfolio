<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive API Fetch Dashboard - Real-time data visualization">
    <title>API Fetch Dashboard | Interactive Web App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        select, input, button {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f0f4ff;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            font-size: 0.95rem;
        }

        .status.loading {
            background: #fff8e1;
            border-left-color: #ffc107;
        }

        .status.error {
            background: #ffebee;
            border-left-color: #f44336;
        }

        .status.success {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-top: 4px solid #667eea;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .card-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .tag {
            background: #f0f4ff;
            color: #667eea;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .loading-state, .empty-state, .error-state {
            text-align: center;
            padding: 40px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .empty-state, .error-state {
            color: #999;
        }

        .error-state {
            color: #f44336;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #999;
            font-weight: 500;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 API Fetch Dashboard</h1>
            <p>Real-time data visualization from public APIs</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="apiSelect">Select API:</label>
                <select id="apiSelect">
                    <option value="users">Random Users</option>
                    <option value="posts">Posts & Comments</option>
                    <option value="todos">Todo List</option>
                </select>
            </div>
            <div class="control-group">
                <label for="itemCount">Number of Items:</label>
                <input type="number" id="itemCount" min="1" max="20" value="5">
            </div>
            <div class="control-group">
                <button id="fetchBtn" onclick="fetchData()">📥 Fetch Data</button>
            </div>
            <div class="control-group">
                <button id="clearBtn" onclick="clearData()">🗑️ Clear</button>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="statsContainer" class="stats"></div>

        <div id="dashboard" class="dashboard-grid"></div>

        <footer>
            <p>Built with vanilla JavaScript | Fetching from JSON Placeholder API</p>
        </footer>
    </div>

    <script>
        const API_BASE = 'https://jsonplaceholder.typicode.com';
        const dashboard = document.getElementById('dashboard');
        const statusEl = document.getElementById('status');
        const statsContainer = document.getElementById('statsContainer');

        function showStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'flex';

            if (type !== 'loading') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 4000);
            }
        }

        function showLoading() {
            statusEl.innerHTML = '<div class="spinner"></div> Loading data...';
            statusEl.className = 'status loading';
            statusEl.style.display = 'flex';
        }

        async function fetchData() {
            const apiType = document.getElementById('apiSelect').value;
            const count = Math.min(parseInt(document.getElementById('itemCount').value) || 5, 20);

            dashboard.innerHTML = '';
            statsContainer.innerHTML = '';
            showLoading();

            try {
                let data = [];
                let title = '';

                if (apiType === 'users') {
                    const response = await fetch(`${API_BASE}/users?_limit=${count}`);
                    data = await response.json();
                    title = 'Random Users';
                    displayUsers(data);
                } else if (apiType === 'posts') {
                    const response = await fetch(`${API_BASE}/posts?_limit=${count}`);
                    data = await response.json();
                    title = 'Recent Posts';
                    displayPosts(data);
                } else if (apiType === 'todos') {
                    const response = await fetch(`${API_BASE}/todos?_limit=${count}`);
                    data = await response.json();
                    title = 'Todo Items';
                    displayTodos(data);
                }

                displayStats(data, apiType);
                showStatus(`✅ Successfully loaded ${data.length} items`, 'success');
            } catch (error) {
                dashboard.innerHTML = `<div class="error-state"><p>❌ Error: ${error.message}</p></div>`;
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        function displayUsers(users) {
            users.forEach(user => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>👤 ${user.name}</h3>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Phone:</strong> ${user.phone}</p>
                    <p><strong>Website:</strong> ${user.website}</p>
                    <div class="card-meta">
                        <span class="tag">User ID: ${user.id}</span>
                        <span class="tag">${user.company.name}</span>
                    </div>
                `;
                dashboard.appendChild(card);
            });
        }

        function displayPosts(posts) {
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>📝 ${post.title}</h3>
                    <p>${post.body}</p>
                    <div class="card-meta">
                        <span class="tag">Post ID: ${post.id}</span>
                        <span class="tag">By User ${post.userId}</span>
                    </div>
                `;
                dashboard.appendChild(card);
            });
        }

        function displayTodos(todos) {
            todos.forEach(todo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>✓ ${todo.title}</h3>
                    <p><strong>Status:</strong> ${todo.completed ? '✅ Completed' : '⏳ Pending'}</p>
                    <div class="card-meta">
                        <span class="tag">Todo ID: ${todo.id}</span>
                        <span class="tag">User ${todo.userId}</span>
                        <span class="tag">${todo.completed ? 'Complete' : 'Incomplete'}</span>
                    </div>
                `;
                dashboard.appendChild(card);
            });
        }

        function displayStats(data, type) {
            let stats = {};

            if (type === 'users') {
                stats = {
                    'Total Users': data.length,
                    'Companies': new Set(data.map(u => u.company.name)).size
                };
            } else if (type === 'posts') {
                stats = {
                    'Total Posts': data.length,
                    'Unique Authors': new Set(data.map(p => p.userId)).size
                };
            } else if (type === 'todos') {
                const completed = data.filter(t => t.completed).length;
                stats = {
                    'Total Todos': data.length,
                    'Completed': completed,
                    'Pending': data.length - completed
                };
            }

            Object.entries(stats).forEach(([label, value]) => {
                const statCard = document.createElement('div');
                statCard.className = 'stat-card';
                statCard.innerHTML = `
                    <div class="stat-value">${value}</div>
                    <div class="stat-label">${label}</div>
                `;
                statsContainer.appendChild(statCard);
            });
        }

        function clearData() {
            dashboard.innerHTML = '';
            statsContainer.innerHTML = '';
            statusEl.style.display = 'none';
            showStatus('Data cleared', 'success');
        }

        // Auto-fetch on load
        window.addEventListener('load', () => {
            fetchData();
        });
    </script>
</body>
</html>
